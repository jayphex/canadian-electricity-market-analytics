<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <rect width="980" height="540" fill="white"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .tick { font-size: 14px; fill: #4b5563; }
    .legend { font-size: 15px; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .zero { stroke: #111827; stroke-width: 1.5; }
    .hydro { fill: none; stroke: #4c78a8; stroke-width: 3; }
    .other { fill: none; stroke: #f58518; stroke-width: 3; }
    .hydro-dot { fill: #4c78a8; }
    .other-dot { fill: #f58518; }
  </style>
  <text x="490" y="38" text-anchor="middle" class="title">Annual hydro change versus other generation sources</text>

  <line x1="90" y1="80" x2="90" y2="430" class="grid"/>
  <line x1="90" y1="430" x2="900" y2="430" class="grid"/>
  <line x1="90" y1="255" x2="900" y2="255" class="zero"/>
  <line x1="90" y1="138" x2="900" y2="138" class="grid"/>
  <line x1="90" y1="372" x2="900" y2="372" class="grid"/>

  <g class="tick" text-anchor="end">
    <text x="78" y="143">10</text><text x="78" y="260">0</text><text x="78" y="377">−10</text>
  </g>
  <text x="26" y="255" transform="rotate(-90 26 255)" text-anchor="middle" class="tick">Year-over-year change (million MWh)</text>

  <g class="tick" text-anchor="middle">
    <text x="100" y="455">2017</text><text x="200" y="455">2018</text><text x="300" y="455">2019</text><text x="400" y="455">2020</text><text x="500" y="455">2021</text><text x="600" y="455">2022</text><text x="700" y="455">2023</text><text x="800" y="455">2024</text><text x="900" y="455">2025</text>
  </g>
  <text x="495" y="490" text-anchor="middle" class="tick">Year</text>

  <polyline points="100,129 200,333 300,352 400,343 500,346 600,308 700,338 800,354 900,236" class="hydro"/>
  <polyline points="100,379 200,232 300,242 400,278 500,168 600,131 700,241 800,338 900,90" class="other"/>

  <g>
    <circle cx="100" cy="129" r="5" class="hydro-dot"/><circle cx="200" cy="333" r="5" class="hydro-dot"/><circle cx="300" cy="352" r="5" class="hydro-dot"/><circle cx="400" cy="343" r="5" class="hydro-dot"/><circle cx="500" cy="346" r="5" class="hydro-dot"/><circle cx="600" cy="308" r="5" class="hydro-dot"/><circle cx="700" cy="338" r="5" class="hydro-dot"/><circle cx="800" cy="354" r="5" class="hydro-dot"/><circle cx="900" cy="236" r="5" class="hydro-dot"/>
    <circle cx="100" cy="379" r="5" class="other-dot"/><circle cx="200" cy="232" r="5" class="other-dot"/><circle cx="300" cy="242" r="5" class="other-dot"/><circle cx="400" cy="278" r="5" class="other-dot"/><circle cx="500" cy="168" r="5" class="other-dot"/><circle cx="600" cy="131" r="5" class="other-dot"/><circle cx="700" cy="241" r="5" class="other-dot"/><circle cx="800" cy="338" r="5" class="other-dot"/><circle cx="900" cy="90" r="5" class="other-dot"/>
  </g>

  <line x1="120" y1="515" x2="150" y2="515" class="hydro"/><circle cx="135" cy="515" r="5" class="hydro-dot"/><text x="160" y="520" class="legend">Hydro</text>
  <line x1="270" y1="515" x2="300" y2="515" class="other"/><circle cx="285" cy="515" r="5" class="other-dot"/><text x="310" y="520" class="legend">Combustible + nuclear + wind/solar</text>
</svg>

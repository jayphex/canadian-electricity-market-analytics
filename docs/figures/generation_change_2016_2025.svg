<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660">
<rect width="1100" height="660" fill="#F7F4EF"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.title{font-size:31px;font-weight:700}.sub{font-size:18px;fill:#66625D}.tick{font-size:15px;fill:#66625D}.cat{font-size:19px;font-weight:600}.val{font-size:17px;font-weight:700}.foot{font-size:13px;fill:#66625D}.brand{font-size:12px;fill:#66625D;font-weight:700;letter-spacing:1px}.grid{stroke:#D9D4CC;stroke-width:1}.zero{stroke:#171717;stroke-width:1.2}
</style>
<text x="105" y="70" class="title">Canada lost hydro and nuclear output while wind and solar expanded</text>
<text x="105" y="108" class="sub">Change in annual electricity generation by source, 2016 to 2025</text>
<g class="grid">
<line x1="282" y1="170" x2="282" y2="520"/><line x1="383" y1="170" x2="383" y2="520"/><line x1="484" y1="170" x2="484" y2="520"/><line x1="585" y1="170" x2="585" y2="520"/><line x1="686" y1="170" x2="686" y2="520"/><line x1="787" y1="170" x2="787" y2="520"/><line x1="888" y1="170" x2="888" y2="520"/>
</g>
<line x1="686" y1="170" x2="686" y2="520" class="zero"/>
<g class="tick" text-anchor="middle">
<text x="282" y="550">−40</text><text x="383" y="550">−30</text><text x="484" y="550">−20</text><text x="585" y="550">−10</text><text x="686" y="550">0</text><text x="787" y="550">10</text><text x="888" y="550">20</text>
</g>
<text x="585" y="590" class="tick" text-anchor="middle">Change in annual generation (million MWh)</text>
<g>
<text x="250" y="219" class="cat" text-anchor="end">Hydro</text><rect x="302" y="188" width="384" height="48" rx="2" fill="#315D8C"/><text x="288" y="219" class="val" text-anchor="end">−38.0</text>
<text x="250" y="309" class="cat" text-anchor="end">Nuclear</text><rect x="544" y="278" width="142" height="48" rx="2" fill="#6B5BD2"/><text x="530" y="309" class="val" text-anchor="end">−14.1</text>
<text x="250" y="399" class="cat" text-anchor="end">Combustible fuels</text><rect x="686" y="368" width="68" height="48" rx="2" fill="#B2861B"/><text x="768" y="399" class="val">+6.7</text>
<text x="250" y="489" class="cat" text-anchor="end">Wind + solar</text><rect x="686" y="458" width="244" height="48" rx="2" fill="#2E8B6D"/><text x="944" y="489" class="val">+24.2</text>
</g>
<text x="105" y="630" class="foot">Source: Statistics Canada, table 25-10-0015</text>
<text x="995" y="630" class="brand" text-anchor="end">CANADIAN ELECTRICITY MARKET ANALYTICS</text>
</svg>
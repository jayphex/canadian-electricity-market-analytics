name: Provincial history ingestion

on:
  pull_request:
    paths:
      - "src/fetch_statcan_wds.py"
      - "src/analyze_provincial_history.py"
      - ".github/workflows/provincial-history.yml"

jobs:
  fetch-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Fetch StatsCan 2016-2025 provincial generation panel
        run: python src/fetch_statcan_wds.py --start-year 2016 --end-year 2025 --output-dir data/raw/statcan_wds
      - name: Validate and build descriptive outputs
        run: python src/analyze_provincial_history.py data/raw/statcan_wds/statcan_25100015_wds_raw.csv --output-dir data/processed/provincial_history
      - name: Upload raw and validated audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: statcan-provincial-history
          path: |
            data/raw/statcan_wds/
            data/processed/provincial_history/
